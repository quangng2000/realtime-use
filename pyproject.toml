[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-use"
version = "0.2.0"
description = "Independent causal speech enhancement training baselines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.5,<3",
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
  "soundfile>=0.12,<1",
  "lightning>=2.5,<3",
  "torchmetrics>=1.6,<2",
  "auraloss==0.4.0",
  "einops>=0.8,<1",
  "hydra-core>=1.3.2,<1.4",
]

[project.scripts]
realtime-use-train = "realtime_use.train:main"
realtime-use-preflight = "realtime_use.preflight:main"
realtime-use-prepare-data = "realtime_use.prepare_data:main"
realtime-use-materialize-sources = "realtime_use.materialize_sources:main"
realtime-use-prepare-release = "realtime_use.prepare_release:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
augmentation = ["audiomentations==0.43.1"]
gan = ["descript-audio-codec==1.0.0", "descript-audiotools==0.7.2"]
cuda = ["mamba-ssm==2.2.6.post3", "causal-conv1d==1.6.0", "transformers==4.57.6"]
metrics = ["pystoi==0.4.1", "soxr==0.5.0.post1", "onnxruntime==1.22.1", "torchaudio>=2.5,<3", "librosa>=0.11,<1", "pandas>=2.2,<4", "requests>=2.31,<3", "tqdm>=4.66,<5"]
metrics-content = ["transformers==4.57.6", "jiwer==4.0.0", "phonemizer==3.3.0", "espnet==202509", "openai-whisper==20250625", "soxr==0.5.0.post1"]
preparation = ["espnet==202509", "torchaudio==2.7.1", "resampy==0.4.3"]
backup-acceleration = ["isal==1.8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
realtime_use = ["conf/*.yaml", "conf/*/*.yaml", "_vendor/nemotron_codec/*", "_vendor/espnet_detection/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "training_loop: executes Trainer.fit, optimizer updates, or a subprocess training worker; skipped by --no-training",
]
