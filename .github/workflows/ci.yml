name: CPU tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_training_tests:
        description: "Explicitly run optimizer and training lifecycle tests"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.7.1 torchaudio==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,augmentation,gan]'
          python -m pip install pystoi==0.4.1 soxr==0.5.0.post1
      - name: Run inference, gradient, validation, data, and metric tests without training
        if: github.event_name != 'workflow_dispatch' || !inputs.run_training_tests
        run: python -m pytest -q --no-training
      - name: Run full suite including explicitly requested training tests
        if: github.event_name == 'workflow_dispatch' && inputs.run_training_tests
        run: python -m pytest -q
