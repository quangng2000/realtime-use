# Independent starting recipe; step counts are not a recovered paper schedule.
model:
  sample_rate: 16000
  window_ms: 40.0
  hop_ms: 20.0
  depth: 12
  exits:
  - 12
  width: 64
  state_dim: 16
  expand: 4
  conv_kernel: 4
  decoder_mode: shared
  scan_backend: auto
training:
  stage: regression
  steps: 100000
  batch_size: 4
  crop_seconds: 2.0
  lr: 0.0002
  weight_decay: 0.01
  grad_accum: 1
  clip_grad_norm: 5.0
  precision: fp32
  sample_exit: false
  split_decoders_at: null
  predecoder_lr_scale: 0.1
  seed: 0
  workers: 0
  checkpoint_every: 1000
  log_every: 10
  validate_every: 1000
  validation_batches: 20
loss:
  waveform: 1.0
  stft: 1.0
  kd: 0.0
  fft_sizes:
  - 256
  - 512
  - 1024
adversarial:
  lr: 0.0002
  weight: 0.01
  feature_matching: 0.1
  channels: 16
  scales: 3
